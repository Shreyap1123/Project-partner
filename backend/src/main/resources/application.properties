# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=projectpartner-backend

# Active profile (defaults to h2 for instant out-of-the-box run; switch to mysql by setting SPRING_PROFILES_ACTIVE=mysql)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# JWT Token Configuration
app.jwt.secret=ProjectPartnerSuperSecretKeyThatIsAtLeast32BytesLongForHS256Security
app.jwt.expiration-ms=86400000

# File upload max sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
